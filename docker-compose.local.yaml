services:
  postgres:
    container_name: void-postgres
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - ./.db/postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD
    ports:
      - "5432:5432"

  redis:
    container_name: void-redis
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD
    ports:
      - "6379:6379"
